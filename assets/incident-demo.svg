<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Пример incident report</title><desc id="desc">Карточка отчёта об инциденте с этапами evidence, hypothesis и plan</desc>
<rect width="1100" height="560" rx="18" fill="#f8fafc"/><rect x="28" y="28" width="1044" height="82" rx="14" fill="#0f172a"/><text x="58" y="68" fill="#67e8f9" font-family="monospace" font-size="19">incident_report("disk")</text><text x="58" y="94" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">evidence → hypothesis → plan → human confirmation</text>
<rect x="28" y="136" width="324" height="300" rx="14" fill="#e0f2fe"/><rect x="388" y="136" width="324" height="300" rx="14" fill="#ede9fe"/><rect x="748" y="136" width="324" height="300" rx="14" fill="#dcfce7"/>
<text x="54" y="180" fill="#0369a1" font-family="system-ui, sans-serif" font-size="21" font-weight="700">1 · Evidence</text><text x="54" y="226" fill="#334155" font-family="monospace" font-size="17">/dev/sda1</text><text x="54" y="258" fill="#0f172a" font-family="system-ui, sans-serif" font-size="27" font-weight="700">87% used</text><text x="54" y="310" fill="#475569" font-family="system-ui, sans-serif" font-size="16">Bounded df + du output</text><text x="54" y="340" fill="#475569" font-family="system-ui, sans-serif" font-size="16">Only allowlisted paths</text>
<text x="414" y="180" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="21" font-weight="700">2 · Hypothesis</text><text x="414" y="230" fill="#334155" font-family="system-ui, sans-serif" font-size="16">Disk usage exceeds the</text><text x="414" y="258" fill="#334155" font-family="system-ui, sans-serif" font-size="16">configured threshold.</text><text x="414" y="330" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="16">confidence: medium</text>
<text x="774" y="180" fill="#15803d" font-family="system-ui, sans-serif" font-size="21" font-weight="700">3 · Plan</text><text x="774" y="230" fill="#334155" font-family="system-ui, sans-serif" font-size="16">Validate largest directories,</text><text x="774" y="258" fill="#334155" font-family="system-ui, sans-serif" font-size="16">then review cleanup manually.</text><text x="774" y="330" fill="#15803d" font-family="system-ui, sans-serif" font-size="16">No command executed</text>
<text x="40" y="500" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">Пример интерфейса · значения демонстрационные</text>
</svg>
